# XcodeGen spec for the iPhone app. Generate the Xcode project with:
#   brew install xcodegen   (once)
#   cd ios && xcodegen generate
# The generated ExemplarBotanicals.xcodeproj is not committed; regenerate it after pulling.
name: ExemplarBotanicals
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: $(EB_DEVELOPMENT_TEAM)
packages:
  GardenCore:
    path: Packages/GardenCore
targets:
  ExemplarBotanicals:
    type: application
    platform: iOS
    sources:
      - path: ExemplarBotanicals
        excludes:
          - Info.plist
    dependencies:
      - package: GardenCore
    settings:
      base:
        PRODUCT_NAME: ExemplarBotanicals
        PRODUCT_BUNDLE_IDENTIFIER: $(EB_BUNDLE_ID)
        INFOPLIST_FILE: ExemplarBotanicals/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    scheme:
      gatherCoverageData: false
